<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Kind, Rewind — Video Rental (3D)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--neon-core:#ffd9a8;--text:#c9b79c;--text-dim:#7d6a52;--sticker-yellow:#e9c832;--ink:#2b2118}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0705;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
#c{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0705;z-index:100}
#loading .neon{font-weight:700;letter-spacing:.16em;font-size:clamp(20px,4.5vw,38px);color:var(--neon-core);text-shadow:0 0 4px #ffb054,0 0 14px #ff8a00,0 0 36px #ff6a00}
#loading .sub{font-size:12px;color:var(--text-dim);letter-spacing:.2em}
#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,217,168,.85);box-shadow:0 0 6px rgba(255,140,40,.9);z-index:20;pointer-events:none;display:none}
#hover{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:20;pointer-events:none;display:none;background:rgba(16,7,3,.85);border:1px solid #3a2413;border-radius:3px;padding:7px 14px;font-size:13px;color:#e8dcc4;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#hover .dim{color:var(--text-dim);font-size:11px}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;pointer-events:none;font-size:11px;letter-spacing:.06em;color:var(--text-dim);background:rgba(11,7,5,.7);padding:5px 12px;border-radius:3px;white-space:nowrap}
#topbar{position:fixed;top:12px;left:12px;z-index:20;display:flex;gap:8px}
.hud-link{background:rgba(20,10,4,.8);border:1px solid #3a2413;color:#ffc07a;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;text-decoration:none;border-radius:2px;text-shadow:0 0 8px rgba(255,130,20,.6)}
.hud-link:hover{border-color:#6b4326}
#touch{position:fixed;bottom:18px;left:18px;z-index:20;display:none;gap:10px}
.tbtn{width:56px;height:56px;border-radius:50%;border:1px solid #3a2413;background:rgba(20,10,4,.75);color:#ffc07a;font-size:20px;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none}
.pull-overlay{position:fixed;inset:0;z-index:200;background:rgba(6,3,2,.88);display:none;align-items:center;justify-content:center;padding:20px}
.pull-overlay.open{display:flex}
.pull-case{width:min(320px,86vw);perspective:1200px}
.pull-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,1.4,.6,1)}
.pull-inner.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.pull-inner{transition:none}}
.pull-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 6px 6px 3px;box-shadow:0 18px 60px rgba(0,0,0,.9),0 0 80px rgba(255,110,0,.08)}
.pull-front{position:relative}
.pull-front img{width:100%;display:block;border-radius:3px 6px 6px 3px;aspect-ratio:2/3;object-fit:cover;background:#17171f}
.pull-front .no-art{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:18px;color:var(--text);background:linear-gradient(160deg,#2a2a36,#17171f);border-radius:3px 6px 6px 3px}
.pull-back{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(170deg,#1d1510,#110c08);border:1px solid #35251a;color:#cfc0a4;padding:16px 16px 14px;font-size:12px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
.pull-back h2{font-size:15px;color:var(--neon-core);margin-bottom:2px;line-height:1.25;font-weight:700;text-shadow:0 0 10px rgba(255,120,20,.35)}
.pull-back .da-title{font-style:italic;color:#8f7a5c;font-size:11px;margin-bottom:8px}
.pull-back .synopsis{flex:1;overflow-y:auto;margin-bottom:10px;color:#bfae92}
.pull-back .meta-line{font-size:10.5px;color:#8a7458;margin-bottom:3px}
.pull-back .meta-line b{color:#c2a87f;font-weight:600}
.watched-stamp{position:absolute;top:12px;right:12px;border:2px solid;border-radius:3px;font-size:11px;padding:2px 7px;transform:rotate(9deg);opacity:.9}
.stamp-yes{color:#7ec98a;border-color:#7ec98a}
.stamp-no{color:var(--sticker-yellow);border-color:var(--sticker-yellow)}
.tonight-btn{margin:10px 0 8px;background:#241505;border:1px solid #6b4326;color:#ffc07a;font-size:10.5px;letter-spacing:.1em;padding:8px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase}
.tonight-btn.on{background:#332405;border-color:#e9c832;color:#e9c832}
.tonight-btn:hover{filter:brightness(1.2)}
.barcode{height:26px;margin-top:auto;opacity:.7;background:repeating-linear-gradient(90deg,#cfc0a4 0 2px,transparent 2px 4px,#cfc0a4 4px 7px,transparent 7px 9px,#cfc0a4 9px 10px,transparent 10px 14px)}
.pull-hint{text-align:center;margin-top:14px;font-size:12px;color:#a98c62}
.pull-close{position:absolute;top:-14px;right:-14px;z-index:5;width:34px;height:34px;border-radius:50%;background:#b3402a;color:#f2e8d0;border:none;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.7)}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0705;z-index:150;padding:24px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="neon">VIDEO RENTAL</div><div class="sub">OPENING THE STORE…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TEST_MODE = new URLSearchParams(location.search).has('test');
const CSV_URL = 'https://raw.githubusercontent.com/wonderdk/bekindrewind/main/movies.csv';
const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxZTY3N2ZiMTVjMGM4ZDBkNTMzNjQzMGYxNmNlOTFmMiIsIm5iZiI6MTc3NjQxMjk3Mi4zMDIsInN1YiI6IjY5ZTFlOTJjNmJlM2VmOWRmZThiN2I1MCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.LmxBN4pTZr1OsghaHWA2LkbrqJrGNqftKmyQ1ZUNOQA';

const SECTIONS = [
  { id:'horror',    label:'HORROR',      genres:['Horror'],                       tint:0x4a1616 },
  { id:'thriller',  label:'THRILLER',    genres:['Thriller','Mystery'],           tint:0x261f30 },
  { id:'crime',     label:'CRIME',       genres:['Crime'],                        tint:0x322a1c },
  { id:'scifi',     label:'SCI-FI',      genres:['Sci-Fi','Science Fiction'],     tint:0x1e2f3e },
  { id:'adventure', label:'ADVENTURE',   genres:['Adventure'],                    tint:0x2e3a22 },
  { id:'fantasy',   label:'FANTASY',     genres:['Fantasy'],                      tint:0x243228 },
  { id:'drama',     label:'DRAMA',       genres:['Drama','Romance','History'],    tint:0x33261e },
  { id:'kids',      label:'KIDS',        genres:['Animation','Family'],           tint:0x3d3218 },
  { id:'comedy',    label:'COMEDY',      genres:['Comedy','Music'],               tint:0x453a1a },
  { id:'action',    label:'ACTION',      genres:['Action','War','Western'],       tint:0x3e2413 },
  { id:'docs',      label:'DOCUMENTARY', genres:['Documentary'],                  tint:0x2a3236 },
  { id:'misc',      label:'MISC',        genres:[],                               tint:0x2a2a2a }
];

function parseCSV(text) {
  const rows = [];
  const lines = text.trim().split('\n');
  const parseLine = (line) => {
    const vals = []; let cur = '', inQ = false;
    for (let j = 0; j < line.length; j++) {
      const ch = line[j];
      if (ch === '"') { if (inQ && line[j+1] === '"') { cur += '"'; j++; continue; } inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    vals.push(cur.trim());
    return vals;
  };
  const headers = parseLine(lines[0]);
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseLine(lines[i]);
    if (vals.length < headers.length) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h] = vals[idx] || '');
    if (obj.uid) rows.push(obj);
  }
  return rows;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
/* Which section OWNS a multi-genre film (differs from the shelf order along the store) */
const BUCKET_ORDER = ['kids','horror','thriller','crime','scifi','comedy','adventure','fantasy','drama','action','docs','misc'];
function sectionFor(m) {
  const genres = (m.genre_ids || '').split('|').map(g => g.trim()).filter(Boolean);
  for (const id of BUCKET_ORDER) {
    const s = SECTIONS.find(x => x.id === id);
    if (s.genres.some(g => genres.includes(g))) return s;
  }
  return SECTIONS.find(x => x.id === 'misc');
}
function seededPicks(pool, n) {
  const d = new Date();
  let seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const rand = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  const arr = pool.slice();
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(rand()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; }
  return arr.slice(0, n);
}
// deterministic per-film jitter so the shelves look hand-stocked, not machine-placed
function jitter(uid, salt) {
  let h = salt;
  const s = String(uid);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000003;
  return (h % 1000) / 1000 - 0.5; // -0.5..0.5
}

/* ── store layout: one discrete shelf UNIT per genre, in priority order ──
   Walk order: down the west wall, across the back (under the neon), up the east wall.
   Each unit is sized to its films (4 rows, row-major A→Z across, then next row).
   A unit that does not fit the remaining wall closes that wall and moves on. */
const CASE_W = 0.16, CASE_H = 0.225;
const SLOT = 0.172, UNIT_GAP = 0.15, UNIT_EDGE = 0.05;
const ROWS_SIDE = [2.03, 1.60, 1.17, 0.74];   // top row first (reading order)
const ROWS_BACK = [1.93, 1.52, 1.11, 0.70];   // slightly lower, clearing the neon
function buildWalls() {
  return [
    { name:'west', x0:-1.42, z0:-0.60, dx:0, dz:-1, rotY: Math.PI/2, len:18.8, rows:ROWS_SIDE },
    { name:'back', x0:-1.50, z0:-19.72, dx:1, dz:0, rotY:0,          len:3.00, rows:ROWS_BACK },
    { name:'east', x0: 1.42, z0:-19.50, dx:0, dz:1, rotY:-Math.PI/2, len:18.8, rows:ROWS_SIDE }
  ];
}
function layoutUnits(bySection) {
  const walls = buildWalls();
  const units = [], placements = [];
  let w = 0, cursor = 0;
  for (const sec of SECTIONS) {
    const films = bySection[sec.id] || [];
    if (!films.length) continue;
    let wall = walls[w];
    let cols = Math.ceil(films.length / wall.rows.length);
    let width = cols * SLOT + 2 * UNIT_EDGE;
    while (w < walls.length && cursor + width > walls[w].len) {
      w++; cursor = 0;
      if (w < walls.length) {
        wall = walls[w];
        cols = Math.ceil(films.length / wall.rows.length);
        width = cols * SLOT + 2 * UNIT_EDGE;
      }
    }
    if (w >= walls.length) return { units, placements, overflow: true };
    const unit = { sec, wall, start: cursor, width, cols, count: films.length };
    units.push(unit);
    films.forEach((m, k) => {
      const row = Math.floor(k / cols), col = k % cols;
      const off = cursor + UNIT_EDGE + (SLOT / 2) + col * SLOT;
      placements.push({
        m, sec, unit,
        x: wall.x0 + wall.dx * off,
        z: wall.z0 + wall.dz * off,
        y: wall.rows[row],
        rotY: wall.rotY, run: wall.name
      });
    });
    cursor += width + UNIT_GAP;
  }
  return { units, placements, overflow: false };
}

/* ── canvas textures ── */
function neonCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 340;
  const x = c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 128px Arial Narrow, Arial, sans-serif';
  for (const [blur,col] of [[58,'rgba(255,80,0,.85)'],[30,'#ff6a00'],[14,'#ff9a20']]) {
    x.shadowColor = col; x.shadowBlur = blur; x.fillStyle = '#ffdcb0';
    x.fillText('VIDEO RENTAL', 512, 140);
  }
  x.shadowBlur = 0; x.fillStyle = '#fff0d8'; x.fillText('VIDEO RENTAL', 512, 140);
  x.font = '600 40px Arial, sans-serif';
  x.shadowColor = '#ff8a00'; x.shadowBlur = 20; x.fillStyle = '#e8a45f';
  x.fillText('BE KIND • REWIND', 512, 262);
  x.shadowBlur = 0;
  return c;
}
function tagCanvas(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 72;
  const x = c.getContext('2d');
  x.fillStyle = '#120a05'; x.fillRect(0,0,256,72);
  x.strokeStyle = '#4a2d14'; x.lineWidth = 4; x.strokeRect(2,2,252,68);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 34px Arial Narrow, Arial, sans-serif';
  x.shadowColor = '#ff8a00'; x.shadowBlur = 14; x.fillStyle = '#ffd9a8';
  x.fillText(text, 128, 38);
  x.shadowBlur = 6; x.fillText(text, 128, 38);
  return c;
}
function noteCanvas(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 100;
  const x = c.getContext('2d');
  x.fillStyle = '#e3c235'; x.fillRect(0,0,256,100);
  x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(0,84,256,16);
  x.fillStyle = '#2b2118'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'italic 700 27px Comic Sans MS, cursive, sans-serif';
  const words = text.split(' ');
  if (words.length > 2) { x.fillText(words.slice(0,2).join(' '), 128, 34); x.fillText(words.slice(2).join(' '), 128, 66); }
  else x.fillText(text, 128, 50);
  return c;
}
function carpetCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#260b0a'; x.fillRect(0,0,256,256);
  for (let i = 0; i < 3200; i++) {
    const v = Math.random();
    x.fillStyle = v < .5 ? 'rgba(0,0,0,.35)' : (v < .88 ? 'rgba(85,26,24,.25)' : 'rgba(140,60,42,.12)');
    const s = Math.random() < .8 ? 2 : 3;
    x.fillRect(Math.random()*256, Math.random()*256, s, s);
  }
  return c;
}
function glowPoolCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0, 'rgba(255,120,20,.75)');
  g.addColorStop(.5, 'rgba(255,100,10,.30)');
  g.addColorStop(1, 'rgba(255,90,0,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  return c;
}
function fakePosterCanvas(m, tint) { // TEST_MODE only: stand-in cover art
  const c = document.createElement('canvas'); c.width = 92; c.height = 138;
  const x = c.getContext('2d');
  const h = ((tint >> 16 & 255) + (tint >> 8 & 255)) % 360;
  const g = x.createLinearGradient(0,0,0,138);
  g.addColorStop(0, `hsl(${(h + parseInt(m.uid)*37) % 360} 34% 46%)`);
  g.addColorStop(1, `hsl(${(h + parseInt(m.uid)*37 + 40) % 360} 36% 18%)`);
  x.fillStyle = g; x.fillRect(0,0,92,138);
  x.fillStyle = 'rgba(255,255,255,.85)'; x.textAlign = 'center';
  x.font = '700 11px Arial'; 
  const t = m.title.slice(0, 22);
  x.fillText(t.slice(0, 11), 46, 60);
  x.fillText(t.slice(11), 46, 74);
  return c;
}

/* ── state ── */
let renderer, scene, camera, movies = [];
const posterMeshes = [];
const gondolaPlanes = [];
const colliders = [];
const texState = new Map();
const overviewCache = new Map();
let locked = false, yaw = 0, pitch = 0;
const keys = {};
let touchFwd = 0;
let staticTex = null, staticCtx = null;
let crtMat = null, videoEl = null, videoTex = null, trailerIdx = -1, trailerFails = 0, audioUnlocked = false;
/* Public-domain trailers from the Internet Archive; the CRT falls back to static if they fail.
   Add more entries here: { mp4, ogv } pairs from archive.org/details/... download links. */
const TRAILERS = TEST_MODE ? [
  { mp4: '/t1.webm', ogv: '/t1.webm' },
  { mp4: '/t2.webm', ogv: '/t2.webm' }
] : [
  // local copies committed in the repo root (same origin, no CORS risk)
  { mp4: 'night-of-the-living-dead.mp4' },
  { mp4: 'house-on-haunted-hill.mp4' },
  // remote fallbacks, used when the local files are missing
  { mp4: 'https://archive.org/download/NightOfTheLivingDeadTrailer/NightLivingDeadTrailer_512kb.mp4',
    ogv: 'https://archive.org/download/NightOfTheLivingDeadTrailer/NightLivingDeadTrailer.ogv' },
  { mp4: 'https://archive.org/download/sinema-trailer_house-on-haunted-hill/Trailer%20-%20House%20On%20Haunted%20Hill%20%281959%29%20%28480p_24fps_H264-128kbit_AAC%29.mp4',
    ogv: 'https://archive.org/download/sinema-trailer_house-on-haunted-hill/Trailer%20-%20House%20On%20Haunted%20Hill%20%281959%29%20%28480p_24fps_H264-128kbit_AAC%29.ogv' }
];
let crtDisabled = false;
function nextTrailer() {
  if (!videoEl || crtDisabled || trailerFails >= TRAILERS.length) return; // give up -> static stays
  trailerIdx = (trailerIdx + 1) % TRAILERS.length;
  if (crtMat) { crtMat.map = staticTex; crtMat.needsUpdate = true; } // channel-flip static between tapes
  const t = TRAILERS[trailerIdx];
  videoEl.innerHTML = '';
  for (const [url, type] of [[t.mp4, 'video/mp4'], [t.ogv, 'video/ogg']]) {
    if (!url) continue;
    const src = document.createElement('source');
    src.src = url; src.type = type;
    videoEl.appendChild(src);
  }
  videoEl.load();
  const p = videoEl.play();
  if (p && p.catch) p.catch(() => {});
}
function setupCrtVideo() {
  try {
    videoEl = document.createElement('video');
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.crossOrigin = 'anonymous';
    videoEl.preload = 'auto';
    videoEl.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0.01;pointer-events:none;left:0;top:0;';
    document.body.appendChild(videoEl);
    videoEl.addEventListener('playing', () => {
      trailerFails = 0;
      // taint check: if this source can't be sampled, WebGL would render it black.
      setTimeout(() => {
        if (crtDisabled || videoEl.paused) return;
        try {
          const c = document.createElement('canvas'); c.width = 2; c.height = 2;
          const ctx = c.getContext('2d');
          ctx.drawImage(videoEl, 0, 0, 2, 2);
          ctx.getImageData(0, 0, 1, 1); // throws if cross-origin tainted
          if (!videoTex) {
            videoTex = new THREE.VideoTexture(videoEl);
            videoTex.minFilter = THREE.LinearFilter;
            videoTex.encoding = THREE.sRGBEncoding;
          }
          if (crtMat) { crtMat.map = videoTex; crtMat.needsUpdate = true; }
        } catch(err) {
          console.warn('CRT: video blocked for WebGL (CORS), staying on static', err);
          crtDisabled = true;
          videoEl.pause(); videoEl.muted = true;
          if (crtMat) { crtMat.map = staticTex; crtMat.needsUpdate = true; }
        }
      }, 350);
    });
    videoEl.addEventListener('ended', nextTrailer);
    videoEl.addEventListener('error', () => { trailerFails++; nextTrailer(); });
    // sources exhausted without a decodable file also lands here via the last <source> erroring
    nextTrailer();
  } catch(e) { /* static remains */ }
}
function unlockCrtAudio() {
  if (audioUnlocked || !videoEl) return;
  audioUnlocked = true;
  videoEl.muted = false;
  videoEl.volume = 0;
}
function updateCrtVolume() {
  if (!audioUnlocked || !videoEl) return;
  const dx = camera.position.x - (-1.3), dz = camera.position.z - 1.35;
  const d = Math.sqrt(dx*dx + dz*dz);
  videoEl.volume = Math.max(0, Math.min(1, 1 - d / 3.5)) * 0.45;
}

function fail(msg) {

function refreshGondola() {

    if (e.m && e.m.uid === m.uid && e.tex) { plane.visible = true; return; }
    plane.visible = true;
    plane.userData.m = m;
    e.m = m; e.url = m.poster_url.replace('/w300','/w185');
    e.failed = false; e.loading = false;
    if (e.tex) { e.tex.dispose(); e.tex = null; }
    plane.material.map = null; plane.material.emissiveMap = null; plane.material.emissive.setHex(0x000000);
    plane.material.color.set(0x22222c); plane.material.needsUpdate = true;

/* ── texture streaming (proximity + budget) ── */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
const IS_TOUCH = 'ontouchstart' in window;
const TEX_BUDGET = IS_TOUCH ? 340 : 2000, LOAD_NEAR = IS_TOUCH ? 9 : 60, CONCURRENT = 12;
let inflight = 0;
function applyTex(e, tex) {
  tex.encoding = THREE.sRGBEncoding; // without this, sRGB output washes the covers out
  e.tex = tex;
  const mat = e.mesh.material;
  mat.map = tex;
  mat.color.set(0xf0f0f0);
  // covers self-illuminate ~30% like glossy print, so they stay readable between light pools
  mat.emissiveMap = tex;
  mat.emissive.setHex(0x4a4a4a);
  mat.needsUpdate = true;
}
function streamTextures() {
  const cx = camera.position.x, cz = camera.position.z;
  const entries = [...texState.values()];
  for (const e of entries) {
    const dx = e.mesh.position.x - cx, dz = e.mesh.position.z - cz;
    e.d2 = (!e.url) ? Infinity : (dx*dx + dz*dz) * (e.prio ? 0.15 : 1); // picks win; empty slots never load
  }
  entries.sort((a,b) => a.d2 - b.d2);
  // want-set: the nearest in-range entries, up to the budget
  const want = new Set();
  for (const e of entries) {
    if (want.size >= TEX_BUDGET) break;
    if (e.failed) continue;
    if (e.d2 > LOAD_NEAR*LOAD_NEAR) break;
    want.add(e);
  }
  // evict anything loaded that is no longer wanted, so nearer covers get room
  for (const e of entries) {
    if (e.tex && !want.has(e)) {
      const mat = e.mesh.material;
      mat.map = null; mat.emissiveMap = null; mat.emissive.setHex(0x000000);
      mat.color.set(e.tint);
      mat.needsUpdate = true;
      e.tex.dispose(); e.tex = null;
    }
  }
  // load missing wanted entries, nearest first
  for (const e of entries) {
    if (inflight >= CONCURRENT) break;
    if (!want.has(e) || e.tex || e.loading) continue;
    e.loading = true; inflight++;
    if (TEST_MODE) {
      setTimeout(() => { inflight--; e.loading = false; applyTex(e, new THREE.CanvasTexture(fakePosterCanvas(e.m, e.tint))); }, 20);
    } else {
      texLoader.load(e.url, tex => { inflight--; e.loading = false; applyTex(e, tex); },
        undefined, () => { inflight--; e.loading = false; e.failed = true; });
    }
  }
}

/* ── controls ── */
function setupControls(canvas) {
  canvas.addEventListener('click', () => {
    unlockCrtAudio();
    if (document.getElementById('pull-overlay').classList.contains('open')) return;
    if (!locked) { canvas.requestPointerLock?.(); return; }
    if (hovered) openCase(hovered.userData.m);
  });
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvas;
    document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });
  document.addEventListener('keydown', e => { keys[e.code] = true; });
  document.addEventListener('keyup',   e => { keys[e.code] = false; });

  let lastTouch = null;
  canvas.addEventListener('touchstart', e => { lastTouch = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (lastTouch) {
      yaw   -= (t.clientX - lastTouch.clientX) * 0.004;
      pitch -= (t.clientY - lastTouch.clientY) * 0.004;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    }
    lastTouch = t;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { lastTouch = null; }, { passive: true });
  const bind = (id, v) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); touchFwd = v; }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); touchFwd = 0; }, { passive: false });
  };
  bind('t-fwd', 1); bind('t-back', -1);
  if ('ontouchstart' in window) {
    document.getElementById('touch').style.display = 'flex';
    document.getElementById('hint').textContent = 'Drag to look · hold ▲ to walk · tap a cover to pull it';
    canvas.addEventListener('touchend', unlockCrtAudio, { passive: true, once: true });
    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length !== 1) return;
      const t = e.changedTouches[0];
      const hit = raycastAt((t.clientX/innerWidth)*2 - 1, -(t.clientY/innerHeight)*2 + 1);
      if (hit) openCase(hit.userData.m);
    }, { passive: true });
  }
}
function movePlayer(dt) {
  const speed = 2.2;
  let fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + touchFwd;
  let strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (!fwd && !strafe) return;
  const len = Math.hypot(fwd, strafe) || 1;
  fwd /= len; strafe /= len;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  const dx = (-sin * fwd + cos * strafe) * speed * dt;
  const dz = (-cos * fwd - sin * strafe) * speed * dt;
  const r = 0.26;
  const blocked = (x, z) => {
    for (const c of colliders) if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return true;
    return false;
  };
  let nx = camera.position.x + dx;
  nx = Math.max(-1.62 + r, Math.min(1.62 - r, nx));
  if (!blocked(nx, camera.position.z)) camera.position.x = nx;
  let nz = camera.position.z + dz;
  nz = Math.max(-19.62 + r, Math.min(2.1 - r, nz));
  if (!blocked(camera.position.x, nz)) camera.position.z = nz;
}

const raycaster = new THREE.Raycaster();
raycaster.far = 3.4;

function raycastAt(ndcX, ndcY) {
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const hits = raycaster.intersectObjects(posterMeshes, false);
  return hits.length ? hits[0].object : null;
}
function updateHover() {
  hovered = locked ? raycastAt(0, 0) : null;
  const el = document.getElementById('hover');

}

    const kind = id0 ? 'movie' : 'tv';
    if (!id) return none;
    const d = await fetch(`https://api.themoviedb.org/3/${kind}/${id}`, { headers: hdrs }).then(r => r.json());
    const det = { ov: d.overview || '', score: d.vote_average ? Math.round(d.vote_average * 10) : null };
    overviewCache.set(m.uid, det);
    return det;
  } catch(e) { return none; }
}
async function openCase(m) {
  if (!m) return;
  document.exitPointerLock?.();
  const front = document.getElementById('pull-front');
  const back = document.getElementById('pull-back');
  inner.classList.remove('flipped');
  front.innerHTML = m.poster_url
    ? `<img src="${escHtml(m.poster_url.replace('/w300','/w500'))}" alt="${escHtml(m.title)}">`
    : `<div class="no-art">${escHtml(m.title)}</div>`;
  const watched = m.watched === 'true';
  const actors = (m.actors || '').split('|').filter(a => a && a !== '-').join(', ');
  const genres = (m.genre_ids || '').split('|').filter(Boolean).join(', ');
  const inTonight = tonightSet().has(m.imdb_id);
  back.innerHTML = `
    <div class="watched-stamp ${watched ? 'stamp-yes' : 'stamp-no'}">${watched ? 'SEEN' : 'NOT SEEN'}</div>
    <h2>${escHtml(m.title)}</h2>
    ${m.title_da && m.title_da !== m.title ? `<div class="da-title">${escHtml(m.title_da)}</div>` : '<div class="da-title"></div>'}
    <div class="synopsis" id="pull-synopsis">Fetching the back-cover text…</div>
    ${genres ? `<div class="meta-line"><b>Genre:</b> ${escHtml(genres)}</div>` : ''}
    ${m.director ? `<div class="meta-line"><b>Director:</b> ${escHtml(m.director)}</div>` : ''}
    ${actors ? `<div class="meta-line"><b>Starring:</b> ${escHtml(actors)}</div>` : ''}
    <div class="meta-line"><b>${escHtml(m.year)}</b> · ${escHtml(m.format)}${m.runtime && m.runtime !== '0' ? ` · ${escHtml(m.runtime)} min` : ''}<span id="pull-score"></span>${m.box_set ? ` · From the box set: ${escHtml(m.box_set)}` : ''}</div>
    <button class="tonight-btn ${inTonight ? 'on' : ''}" id="pull-tonight">${inTonight ? '★ ON TONIGHT\'S SHELF — TAP TO REMOVE' : '☆ ADD TO TONIGHT\'S PICKS'}</button>
    <div class="barcode"></div>`;
  document.getElementById('pull-tonight').addEventListener('click', (ev) => {
    ev.stopPropagation();
    const t = tonightSet();
    if (t.has(m.imdb_id)) t.delete(m.imdb_id); else t.add(m.imdb_id);
    localStorage.setItem('tonight', JSON.stringify([...t]));
    const on = t.has(m.imdb_id);
    ev.target.className = 'tonight-btn' + (on ? ' on' : '');
    ev.target.textContent = on ? "★ ON TONIGHT'S SHELF — TAP TO REMOVE" : "☆ ADD TO TONIGHT'S PICKS";
    refreshGondola();
  });
  overlay.classList.add('open');
  const det = await fetchDetails(m);
  const syn = document.getElementById('pull-synopsis');
  if (syn) syn.textContent = det.ov || 'The back-cover text has gone missing. Ask at the counter.';
  const sc = document.getElementById('pull-score');
  if (sc && det.score !== null) sc.textContent = ` · TMDB ${det.score}%`;
}
inner.addEventListener('click', e => { if (e.target.id !== 'pull-close') inner.classList.toggle('flipped'); });
document.getElementById('pull-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });

/* ── boot ── */
async function init() {
  const canvas = document.getElementById('c');
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch(e) { return fail('Your browser could not start WebGL, so the 3D store cannot open.'); }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.05, 40);
  camera.position.set(0, 1.5, 1.7);
  yaw = 0; pitch = -0.03;

  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    movies = parseCSV(await res.text());
  } catch(e) {
    return fail('The shop could not open: the film database did not load. Check your connection and reload.');
  }

  buildRoom();
  buildCases();
  setupControls(canvas);
  setupCrtVideo();

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById('loading').style.display = 'none';

  let last = performance.now(), frame = 0, lastStream = 0, lastStatic = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    movePlayer(dt);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw);
    camera.rotateX(pitch);
    if (frame % 2 === 0) updateHover();
    if (now - lastStream > 420) { streamTextures(); lastStream = now; }
    if (now - lastStatic > 130) { updateStatic(); lastStatic = now; }
    updateCrtVolume();
    renderer.render(scene, camera);
    frame++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // test hook for headless screenshot iteration
  window.__test = {
    ready: true,
    setCam(x, z, y, yw, pt) { camera.position.set(x, y, z); yaw = yw; pitch = pt; },
    counts: () => ({ films: posterMeshes.length, textures: [...texState.values()].filter(e => e.tex).length })
  };
}
init();
</script>
