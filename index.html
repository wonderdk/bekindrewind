<!DOCTYPE html>
<!-- test write -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Kind, Rewind</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#003087">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Be Kind, Rewind">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f1628;font-family:system-ui,sans-serif;color:#e8ecf8;min-height:100vh}
  header{background:#003087;border-bottom:3px solid #FFD600;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{background:#FFD600;color:#003087;font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;letter-spacing:.05em}
  .logo-text{color:#fff;font-size:15px;font-weight:500;letter-spacing:.05em}
  nav{display:flex;gap:2px}
  .nav-item{color:#9BA3C4;font-size:13px;padding:6px 14px;border-radius:3px;cursor:pointer;border:1px solid transparent;position:relative}
  .nav-item:hover{color:#fff}
  .nav-item.active{color:#fff;background:#1a3a6a;border-color:#2a4a7a}
  .nav-item.tonight.active{color:#FFD600;background:#1a2240;border-color:#FFD600}
  .badge{position:absolute;top:2px;right:2px;background:#FFD600;color:#003087;font-size:9px;font-weight:700;min-width:14px;height:14px;border-radius:7px;display:none;align-items:center;justify-content:center;padding:0 3px}
  .stat{color:#9BA3C4;font-size:12px}
  .stat strong{color:#FFD600}
 .toolbar{background:#0f1628;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid #2a3460;position:sticky;top:56px;z-index:90;}
.search-wrap{position:relative;width:100%;}
.search{background:#0f1628;border:1px solid #2a3460;border-radius:4px;padding:7px 34px 7px 12px;color:#fff;font-size:13px;width:100%;outline:none;}
.search::placeholder{color:#556080}
.search-clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#556080;font-size:16px;line-height:1;cursor:pointer;padding:4px 9px;display:none;}
.search-clear:hover{color:#e8ecf8}
@media(min-width:700px){
  .search-wrap{flex:1;width:auto;min-width:220px}
  .toolbar-right{width:auto;flex-wrap:nowrap}
  .toolbar-select{flex:0 0 auto;min-width:0}
}
.toolbar-right{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;}
.toolbar-select{background:#0f1628;border:1px solid #2a3460;color:#9BA3C4;font-size:12px;padding:5px 10px;border-radius:3px;cursor:pointer;outline:none;flex:1;min-width:100px;}
  .unwatched-label{display:flex;align-items:center;gap:5px;color:#9BA3C4;font-size:12px;cursor:pointer;white-space:nowrap;padding:0 4px}
  .body{padding:24px}
  .shelf-label{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .shelf-title{color:#FFD600;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .shelf-line{flex:1;height:1px;background:#2a3460}
  .shelf-count{color:#556080;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(187px,1fr));gap:12px;margin-bottom:32px}
  .card{background:#1a2240;border-radius:4px;overflow:hidden;border:1px solid #2a3460;cursor:pointer;position:relative}
  .card:hover{border-color:#4a5580}
  .card.queued{border-color:#3a4a6a}
  .poster{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#232847}
  .scanlines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:2}
  .poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .fmt-badge{position:absolute;top:6px;right:6px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:2px;z-index:3;letter-spacing:.04em}
  .fmt-DVD{background:#8B0000;color:#ffaaaa}
  .fmt-Blu-ray{background:#003087;color:#7aaeff;border:1px solid #0044cc}
  .fmt-4K,.fmt-4KUltraHD{background:#111;color:#FFD600;border:1px solid #FFD600}
  .fmt-VHS{background:#2a2a2a;color:#ff8c42;border:1px solid #ff8c42}
  .watched-dot{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;z-index:4;cursor:pointer;}
  .w-yes{background:#4CAF50;}
  .w-no{background:#556080;border:1px solid #7a8aaa;}
  .pip{position:absolute;bottom:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#FFD600;display:none;z-index:3}
  .boxset-icon{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,0.7);color:#FFD600;font-size:8px;font-weight:700;padding:2px 4px;border-radius:2px;letter-spacing:.04em;z-index:3;cursor:default;}
  .card.queued .pip{display:block}
  .card-info{padding:7px 8px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
  .card-meta{flex:1;min-width:0}
  .card-title{color:#e8ecf8;font-size:11px;font-weight:500;line-height:1.3;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-year{color:#556080;font-size:10px}
  .star-btn{background:transparent;border:none;cursor:pointer;padding:1px;flex-shrink:0;margin-top:1px;opacity:.25;line-height:1}
  .star-btn:hover{opacity:.6}
  .card.queued .star-btn{opacity:1}
  .tonight-view{padding:24px}
  .tonight-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .tonight-title{color:#FFD600;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .clear-btn{background:transparent;border:1px solid #2a3460;color:#556080;font-size:11px;padding:4px 12px;border-radius:3px;cursor:pointer}
  .clear-btn:hover{color:#9BA3C4;border-color:#556080}
  .tonight-empty{color:#556080;font-size:13px;text-align:center;padding:60px 0;line-height:1.8}
  .tonight-list{display:flex;flex-direction:column;gap:8px}
  .tonight-row{background:#1a2240;border:1px solid #2a3460;border-radius:4px;display:flex;align-items:center;gap:14px;padding:10px 14px}
  .tonight-num{color:#556080;font-size:12px;width:16px;flex-shrink:0}
  .tonight-row-poster{width:36px;height:54px;border-radius:2px;overflow:hidden;flex-shrink:0;background:#232847;display:flex;align-items:center;justify-content:center;position:relative}
  .tonight-row-poster img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
  .tonight-row-info{flex:1;min-width:0}
  .tonight-row-title{color:#e8ecf8;font-size:13px;font-weight:500;margin-bottom:3px}
  .tonight-row-meta{color:#556080;font-size:11px;display:flex;gap:10px}
  .tonight-fmt{font-size:9px;font-weight:700;padding:1px 4px;border-radius:2px}
  .tonight-remove{background:transparent;border:none;color:#2a3460;cursor:pointer;font-size:18px;line-height:1;padding:2px 4px}
  .tonight-remove:hover{color:#9BA3C4}
  .hidden{display:none}
  @media(max-width:600px){
  .bb-logo-text{font-size:13px;}
  .bb-nav-item{font-size:12px;padding:5px 10px;}
  .bb-header{padding:0 12px;}
  .toolbar{padding:8px 12px;}
  .bb-search{width:100%;max-width:100%;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .unwatched-label{font-size:11px;}
}
/* ── Wishlist / Stats / Edit ── */
.wish-actions{display:flex;gap:4px;padding:0 8px 8px}
.wish-btn{flex:1;background:#1a2240;border:1px solid #2a3460;color:#9BA3C4;font-size:10px;font-weight:600;padding:5px 4px;border-radius:3px;cursor:pointer;letter-spacing:.03em}
.wish-btn:hover{border-color:#556080;color:#e8ecf8}
.wish-btn.primary{background:#FFD600;color:#003087;border-color:#FFD600}
.wish-btn.primary:hover{background:#ffe033}
.nav-item.wishlist.active{color:#FFD600;background:#1a2240;border-color:#FFD600}
.stats-wrap{padding:24px;max-width:960px;margin:0 auto}
.stats-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:28px}
.stat-card{background:#1a2240;border:1px solid #2a3460;border-radius:4px;padding:14px}
.stat-card-num{color:#FFD600;font-size:24px;font-weight:700;line-height:1}
.stat-card-lbl{color:#9BA3C4;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.stats-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:12px}
.bar-lbl{color:#c4cadf;width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:10px;background:#1a2240;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:#FFD600}
.bar-num{color:#556080;width:34px;text-align:right;flex-shrink:0}
.edit-panel{background:#1a2240;border:1px solid #2a3460;border-radius:4px;padding:16px;margin-bottom:24px;display:none}
.edit-panel.open{display:block}
.edit-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.edit-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.edit-field label{color:#9BA3C4;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.edit-field input,.edit-field select{background:#0f1628;border:1px solid #2a3460;border-radius:3px;padding:7px 10px;color:#fff;font-size:13px;outline:none}
.edit-field input:focus,.edit-field select:focus{border-color:#556080}
.edit-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.danger-btn{background:transparent;border:1px solid #8B0000;color:#ff8080;font-size:12px;padding:7px 14px;border-radius:3px;cursor:pointer}
.danger-btn:hover{background:#2a0a0a}
.offline-note{background:#2a2200;border-bottom:1px solid #FFD600;color:#FFD600;font-size:11px;padding:5px 16px;text-align:center;display:none}
.modal-kind-select{background:#1a2240;border:1px solid #2a3460;color:#9BA3C4;font-size:12px;padding:0 8px;border-radius:4px;outline:none;cursor:pointer}
html,body{overflow-x:hidden;max-width:100%}
@media(max-width:600px){
  .toolbar{padding:8px 12px 10px}
  .toolbar-right{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .toolbar-select{width:100%;min-width:0;padding:8px 10px;font-size:13px}
  .unwatched-label{grid-column:1/-1;justify-content:flex-start;padding:2px 2px 0;font-size:13px}
  .unwatched-label input{width:16px;height:16px}
  header{padding:0 10px;gap:6px}
  .logo{gap:0}
  .logo-text{display:none}
  nav{gap:0;flex:1;justify-content:center;min-width:0}
  .nav-item{padding:6px 7px;font-size:12px;white-space:nowrap}
  .stat{display:none}
  .add-btn{width:30px;height:30px}
}
/* ── Detail view ── */
.detail-view{min-height:100vh}
.detail-backdrop-wrap{position:relative;height:320px;overflow:hidden;background:#111827;flex-shrink:0}
.detail-backdrop{width:100%;height:100%;background-size:cover;background-position:center 20%;background-color:#111827}
.detail-backdrop::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,22,40,.2) 0%,rgba(15,22,40,1) 100%)}
.back-btn{position:absolute;top:16px;left:24px;z-index:10;background:#FFD600;color:#003087;border:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:3px;cursor:pointer;letter-spacing:.04em}
.back-btn:hover{background:#ffe033}
.detail-content{padding:0 24px 48px;max-width:960px;margin:-80px auto 0;position:relative;z-index:1}
.detail-hero{display:flex;gap:24px;align-items:flex-start;margin-bottom:28px}
.detail-poster{width:130px;flex-shrink:0;border-radius:4px;overflow:hidden;border:2px solid #2a3460;background:#232847;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center}
.detail-poster img{width:100%;height:100%;object-fit:cover;display:block}
.detail-info{flex:1;min-width:0;padding-top:8px}
.detail-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:8px;line-height:1.25}
.detail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:#9BA3C4;font-size:12px;margin-bottom:12px}
.detail-meta .fmt-badge{position:static;font-size:9px}
.detail-cert{border:1px solid #556080;border-radius:2px;padding:1px 5px;font-size:11px;color:#9BA3C4}
.detail-boxset-label{background:rgba(0,0,0,.5);border:1px solid #FFD600;color:#FFD600;font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px;letter-spacing:.04em}
.detail-score{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.detail-score-pct{font-size:26px;font-weight:700;color:#FFD600;line-height:1}
.detail-score-lbl{font-size:10px;color:#9BA3C4;line-height:1.4;letter-spacing:.04em;text-transform:uppercase}
.detail-tagline{font-style:italic;color:#9BA3C4;font-size:13px;margin-bottom:14px;line-height:1.5}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.detail-watched-btn{background:#1a2240;border:1px solid #2a3460;color:#9BA3C4;font-size:12px;font-weight:500;padding:7px 14px;border-radius:3px;cursor:pointer}
.detail-watched-btn:hover{border-color:#556080;color:#e8ecf8}
.detail-watched-btn.is-watched{background:#0d2010;border-color:#4CAF50;color:#4CAF50}
.trailer-btn{display:inline-flex;align-items:center;gap:6px;background:#FFD600;color:#003087;border:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:3px;cursor:pointer;text-decoration:none;letter-spacing:.04em}
.trailer-btn:hover{background:#ffe033}
.detail-section{margin-bottom:24px}
.detail-section-title{color:#FFD600;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #2a3460}
.detail-overview{color:#c4cadf;font-size:14px;line-height:1.75}
.detail-director-name{color:#e8ecf8;font-size:14px}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.cast-card{text-align:center}
.cast-photo{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;border:1px solid #2a3460;display:block}
.cast-no-photo{width:100%;aspect-ratio:2/3;background:#1a2240;border-radius:3px;border:1px solid #2a3460}
.cast-name{color:#e8ecf8;font-size:10px;font-weight:500;margin-top:5px;line-height:1.3}
.cast-char{color:#556080;font-size:9px;margin-top:2px;line-height:1.3}
.genre-tags{display:flex;flex-wrap:wrap;gap:6px}
.genre-tag{background:#1a2240;border:1px solid #2a3460;color:#9BA3C4;font-size:11px;padding:4px 12px;border-radius:12px}
.detail-error{color:#556080;padding:60px 0;text-align:center;font-size:14px}
@media(max-width:600px){
  .detail-backdrop-wrap{height:210px}
  .detail-content{margin-top:-50px;padding:0 16px 40px}
  .detail-hero{gap:14px}
  .detail-poster{width:90px}
  .detail-title{font-size:17px}
  .cast-grid{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .back-btn{left:16px;top:12px}
}
/* ── Add Film modal & toast ── */
.add-btn{background:#FFD600;color:#003087;border:none;font-size:20px;font-weight:700;width:32px;height:32px;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;padding-bottom:2px}
.add-btn:hover{background:#ffe033}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:72px 16px 24px;overflow-y:auto}
.modal-box{background:#0f1628;border:1px solid #2a3460;border-radius:6px;width:100%;max-width:560px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #2a3460;flex-shrink:0}
.modal-title{color:#FFD600;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.modal-close{background:transparent;border:none;color:#556080;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:#e8ecf8}
.modal-search-row{display:flex;gap:8px;padding:14px 20px;border-bottom:1px solid #2a3460;flex-shrink:0}
.modal-input{flex:1;background:#1a2240;border:1px solid #2a3460;border-radius:4px;padding:8px 12px;color:#fff;font-size:13px;outline:none}
.modal-input:focus{border-color:#556080}
.modal-input::placeholder{color:#556080}
.modal-search-btn{background:#FFD600;color:#003087;border:none;font-size:12px;font-weight:700;padding:8px 16px;border-radius:4px;cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.modal-search-btn:hover{background:#ffe033}
.modal-results{overflow-y:auto;flex:1}
.modal-result{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid #1a2240}
.modal-result:last-child{border-bottom:none}
.modal-result-poster{width:38px;height:57px;object-fit:cover;border-radius:2px;border:1px solid #2a3460;flex-shrink:0;display:block}
.modal-poster-empty{width:38px;height:57px;background:#1a2240;border-radius:2px;border:1px solid #2a3460;flex-shrink:0}
.modal-result-info{flex:1;min-width:0}
.modal-result-title{color:#e8ecf8;font-size:13px;font-weight:500;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-result-meta{color:#556080;font-size:11px}
.modal-fmt-select{background:#1a2240;border:1px solid #2a3460;color:#9BA3C4;font-size:11px;padding:4px 6px;border-radius:3px;cursor:pointer;outline:none;flex-shrink:0}
.modal-add-btn{background:#FFD600;color:#003087;border:none;font-size:11px;font-weight:700;padding:6px 12px;border-radius:3px;cursor:pointer;flex-shrink:0;white-space:nowrap;letter-spacing:.03em}
.modal-add-btn:hover{background:#ffe033}
.modal-add-btn:disabled{opacity:.45;cursor:default}
.modal-status{color:#9BA3C4;font-size:13px;padding:32px 20px;text-align:center}
.modal-footer{border-top:1px solid #2a3460;padding:12px 20px;flex-shrink:0;display:none;flex-direction:column;gap:10px}
.queue-chips{display:flex;flex-wrap:wrap;gap:6px;max-height:96px;overflow-y:auto}
.queue-chip{display:inline-flex;align-items:center;gap:6px;background:#1a2240;border:1px solid #2a3460;color:#e8ecf8;font-size:11px;padding:3px 8px;border-radius:12px}
.queue-chip-fmt{color:#556080;font-size:9px}
.queue-chip-x{background:transparent;border:none;color:#556080;cursor:pointer;font-size:13px;line-height:1;padding:0}
.queue-chip-x:hover{color:#ff8080}
.modal-footer-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.queue-count{color:#9BA3C4;font-size:12px}
.modal-save-btn{background:#FFD600;color:#003087;border:none;font-size:12px;font-weight:700;padding:8px 18px;border-radius:4px;cursor:pointer;letter-spacing:.04em}
.modal-save-btn:hover{background:#ffe033}
.modal-save-btn:disabled{opacity:.45;cursor:default}
.add-toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#0a2a10;border:1px solid #4CAF50;color:#6ed47a;font-size:12px;font-weight:500;padding:8px 20px;border-radius:4px;z-index:300;pointer-events:none;white-space:nowrap;transition:opacity .4s;display:none}
.add-toast.fade-out{opacity:0}
@media(max-width:600px){
  .modal-overlay{padding-top:0;padding-left:0;padding-right:0;align-items:flex-end}
  .modal-box{border-radius:12px 12px 0 0;max-width:100%;max-height:90vh}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-mark">VIDEO</div>
    <div class="logo-text">Be Kind, Rewind</div>
  </div>
  <nav>
    <div class="nav-item active" id="nav-collection" onclick="switchView('collection')">Collection</div>
    <div class="nav-item wishlist" id="nav-wishlist" onclick="switchView('wishlist')">Wishlist<div class="badge" id="wish-badge"></div></div>
    <div class="nav-item tonight" id="nav-tonight" onclick="switchView('tonight')">Tonight<div class="badge" id="badge"></div></div>
    <div class="nav-item" id="nav-stats" onclick="switchView('stats')">Stats</div>
  </nav>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="stat"><strong id="total">0</strong> titles</div>

<script>
const CSV_URL = 'https://raw.githubusercontent.com/wonderdk/bekindrewind/main/movies.csv';

let GH_TOKEN = localStorage.getItem('gh_token') || '';
const DEFAULT_TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxZTY3N2ZiMTVjMGM4ZDBkNTMzNjQzMGYxNmNlOTFmMiIsIm5iZiI6MTc3NjQxMjk3Mi4zMDIsInN1YiI6IjY5ZTFlOTJjNmJlM2VmOWRmZThiN2I1MCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.LmxBN4pTZr1OsghaHWA2LkbrqJrGNqftKmyQ1ZUNOQA';
let TMDB_TOKEN = localStorage.getItem('tmdb_token') || DEFAULT_TMDB_TOKEN;
let movies = [];
// csvFields is refreshed from the actual CSV header on load, so columns that
// exist in the file (e.g. "hidden") are preserved on write instead of dropped.
let csvFields = ['uid','title','year','format','barcode','imdb_id','runtime','director','watched','poster_url','box_set','genre_ids','title_da','actors','tmdb_rating','overview','wishlist','hidden','primary_genre'];

let genre = 'all';
let shelf = 'all';
let unwatched = false;
let tonight = new Set();
try { tonight = new Set(JSON.parse(localStorage.getItem('tonight') || '[]')); } catch(e) { localStorage.removeItem('tonight'); }
let currentView = 'collection';
let sort = 'title-asc';
let pendingAdds = [];

let tokenResolve = null;
let tokenKind = 'github';
const TOKEN_META = {
  github: {
    title: 'GitHub Token',
    help: 'Paste a fine-grained personal access token with <strong style="color:#e8ecf8">Contents: Read and write</strong> on the bekindrewind repo. It is stored only in this browser.'

    help: 'Paste your TMDB <strong style="color:#e8ecf8">API Read Access Token</strong> (the long JWT from TMDB Settings → API). It is stored only in this browser.'

};
function promptToken(kind = 'github') {

function saveToken() {

  else { GH_TOKEN = t; localStorage.setItem('gh_token', t); }

// All TMDB calls go through here. Ensures a token exists, clears it on 401.
async function tmdbFetch(path) {
  if (!TMDB_TOKEN && !(await promptToken('tmdb'))) throw new Error('No TMDB token');
  const res = await fetch('https://api.themoviedb.org/3' + path, { headers: { Authorization: `Bearer ${TMDB_TOKEN}` } });
  if (res.status === 401) {
    localStorage.removeItem('tmdb_token');
    if (TMDB_TOKEN !== DEFAULT_TMDB_TOKEN) {
      TMDB_TOKEN = DEFAULT_TMDB_TOKEN;
      throw new Error('Your personal TMDB token was rejected and has been cleared. The built-in token will be used from now on; just retry.');
    }
    TMDB_TOKEN = '';
    throw new Error('TMDB rejected the built-in token. Paste a fresh one when asked.');
  }
  if (!res.ok) throw new Error(`TMDB error ${res.status}`);
  return res.json();
}

// Row classification. Collection = not hidden and not wishlist.
function isActive(m) { return m.hidden !== 'true' && m.wishlist !== 'true'; }
function isWish(m) { return m.hidden !== 'true' && m.wishlist === 'true'; }
function cacheMissing() {
  return movies.filter(m => m.hidden !== 'true' && /^tt\d{7,8}$/.test(m.imdb_id) && (!m.overview || !m.tmdb_rating));
}
async function cacheAllTmdb() {
  const btn = document.getElementById('cache-btn');
  const todo = cacheMissing();
  if (!todo.length) return;
  if (!confirm(`Download TMDB info (overview, rating) for ${todo.length} titles and save it into the sheet?\n\nAfter this, film details work for everyone without a TMDB key.`)) return;
  if (!GH_TOKEN && !(await promptToken())) return;
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const m of todo) {
    btn.textContent = `${done}/${todo.length}`;
    try {
      const f = await tmdbFetch(`/find/${m.imdb_id}?external_source=imdb_id`);
      let id = f.movie_results?.[0]?.id, kind = 'movie';
      if (!id) { id = f.tv_results?.[0]?.id; kind = 'tv'; }
      if (!id) { failed++; continue; }
      const d = await tmdbFetch(`/${kind}/${id}`);
      if (!m.overview) m.overview = d.overview || '';
      if (!m.tmdb_rating) m.tmdb_rating = fmtRating(d.vote_average);
      done++;
    } catch(e) { failed++; }
    await new Promise(r => setTimeout(r, 120)); // stay friendly to TMDB
  }
  btn.textContent = 'Saving…';
  const ok = await persist(`Cache TMDB data for ${done} titles`);
  btn.disabled = false;
  btn.textContent = '⭳';
  refreshCounts();
  if (ok) showAddToast(`Cached TMDB info for ${done} titles${failed ? ` (${failed} skipped)` : ''}`);
}
function refreshCounts() {
  document.getElementById('total').textContent = movies.filter(isActive).length;
  const cb = document.getElementById('cache-btn');
  if (cb && !cb.disabled) cb.style.display = cacheMissing().length ? 'inline-flex' : 'none';
  const wb = document.getElementById('wish-badge');
  const wc = movies.filter(isWish).length;
  if (wb) { wb.style.display = wc ? 'flex' : 'none'; wb.textContent = wc; }
}
// Single write path for edits: token check, write, readable error. Returns true on success.
async function persist(message) {
  if (!GH_TOKEN && !(await promptToken())) return false;
  try { await githubWrite(buildCsv(movies), message); return true; }
  catch(e) { console.error('Write failed:', e); alert('Could not save to GitHub.\n\n' + e.message); return false; }
}
// The nine shelves from the v5 shelf plan, in display order.
const SHELVES = ['Kids & Family','Horror','Sci-Fi & Fantasy','Thriller & Crime','Action & Adventure','Comedy','Drama','Danish','TV & Documentaries'];
// Rule-based primary genre for new additions. Same precedence as the shelf plan's genre chain.
// Manual placements (franchise families, director blocks) are not reproduced here; edit the row if it lands wrong.
function primaryGenreFor({ genres = [], kind = 'movie', lang = '' }) {
  const g = new Set(genres);
  const has = (...k) => k.some(x => g.has(x));
  if (kind === 'tv' || has('Documentary')) return 'TV & Documentaries';
  if (has('Animation','Family')) return 'Kids & Family';
  if (lang === 'da') return 'Danish';
  if (has('Horror')) return 'Horror';
  if (has('Science Fiction','Sci-Fi','Fantasy')) return 'Sci-Fi & Fantasy';
  if (has('Action','Adventure','War','Western')) return 'Action & Adventure';
  if (has('Thriller','Mystery','Crime')) return 'Thriller & Crime';
  if (has('Comedy','Music')) return 'Comedy';
  return 'Drama';
}
function fmtRating(v) { const n = parseFloat(v); return isNaN(n) || n === 0 ? '' : n.toFixed(1); }

function buildCsv(list) {
  ['title_da','actors','tmdb_rating','overview','wishlist','hidden','primary_genre'].forEach(f => { if (!csvFields.includes(f)) csvFields.push(f); });
  const header = csvFields.map(f => `"${f}"`).join(',');
  const rows = list.map(m =>
    csvFields.map(f => `"${String(m[f] || '').replace(/"/g,'""')}"`).join(',')
  );
  return [header, ...rows].join('\n');
}

// Writes the CSV back to GitHub. Throws with a readable message on ANY failure
// (bad token, missing permission, stale sha) instead of failing silently.
let _writeChain = Promise.resolve();
function githubWrite(csv, message) {
  // single-flight: concurrent saves queue up instead of racing each other's sha
  const run = _writeChain.then(() => githubWriteInner(csv, message));
  _writeChain = run.catch(() => {});
  return run;
}
async function readJsonSafe(res, what) {
  const txt = await res.text();
  try { return JSON.parse(txt); }
  catch(e) {
    const ct = res.headers.get('content-type') || 'unknown type';
    throw new Error(`${what} came back unreadable (HTTP ${res.status}, ${ct}): "${txt.slice(0, 120)}". This is usually a flaky connection or a network proxy mangling the reply. Try again.`);
  }
}
async function githubWriteInner(csv, message, attempt = 0) {
  const meta = await fetch(GITHUB_API, {
    headers: { Authorization: `token ${GH_TOKEN}` },
    cache: 'no-store'
  });
  if (meta.status === 401 || meta.status === 403) {
    GH_TOKEN = '';
    localStorage.removeItem('gh_token');
    throw new Error(`GitHub rejected the token (HTTP ${meta.status}). The saved token was cleared; you will be asked for a new one on the next save. Check that the token has "Contents: Read and write" permission on the repo.`);
  }
  if (!meta.ok) throw new Error(`Could not read movies.csv metadata (HTTP ${meta.status}).`);
  let sha, content;
  try {
    ({ sha, content } = await readJsonSafe(meta, 'GitHub metadata'));
  } catch(e) {
    if (attempt === 0) { await new Promise(r => setTimeout(r, 700)); return githubWriteInner(csv, message, 1); }
    throw e;
  }
  // Guard: never overwrite the file with fewer rows than it currently has.
  if (content) {
    const remoteRows = parseCSV(decodeURIComponent(escape(atob(content.replace(/\n/g, '')))), false).length;
    const localRows = parseCSV(csv, false).length;
    if (localRows < remoteRows) {
      throw new Error(`Refusing to save: movies.csv on GitHub has ${remoteRows} rows but this page only has ${localRows}. Reload the page to pick up the latest version, then try again.`);
    }
  }
  const res = await fetch(GITHUB_API, {
    method: 'PUT',
    headers: { Authorization: `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message, content: btoa(unescape(encodeURIComponent(csv))), sha })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    if (res.status === 409 && attempt === 0) { // sha raced another save: refetch and retry once
      await new Promise(r => setTimeout(r, 500));
      return githubWriteInner(csv, message, 1);
    }
    throw new Error(`GitHub write failed (HTTP ${res.status})${err.message ? ': ' + err.message : ''}.`);
  }
}

async function toggleWatched(uid) {
  if (!GH_TOKEN && !(await promptToken())) return;
  const m = movies.find(m => m.uid === uid);
  if (!m) return;
  m.watched = m.watched === 'true' ? 'false' : 'true';
  renderGrid();
  renderTonight();
  try {
    await githubWrite(buildCsv(movies), `Toggle watched: ${m.title}`);
  } catch(e) {
    console.error('Write failed:', e);
    m.watched = m.watched === 'true' ? 'false' : 'true';
    renderGrid();
    renderTonight();
    alert('Could not save to GitHub.\n\n' + e.message);
  }
}

// RFC 4180 parser: handles quoted commas, quoted newlines and "" escapes.
// Short rows are padded, never dropped, so nothing disappears on the next write.
function parseCSV(text, updateFields = true) {
  const records = [];
  let row = [], cur = '', inQ = false;
  const t = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inQ) {
      if (c === '"') { if (t[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && t[i+1] === '\n') i++;
      row.push(cur); cur = '';
      if (row.some(v => v !== '')) records.push(row);
      row = [];
    } else cur += c;
  }
  row.push(cur);
  if (row.some(v => v !== '')) records.push(row);
  if (!records.length) return [];
  const headers = records[0].map(h => h.trim());
  if (updateFields && headers.length > 1) csvFields = headers;
  return records.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = (vals[idx] || '').trim());
    return obj;
  });
}

function setSort(val) {
  sort = val;
  renderGrid();
}

function updateSearchClear() {

// Read through the GitHub API so we never get a stale CDN copy of the CSV.
// Falls back to raw.githubusercontent.com if the API is unavailable (rate limit etc).
async function fetchCsvText() {
  try {
    const hdrs = { Accept: 'application/vnd.github.raw' };
    if (GH_TOKEN) hdrs.Authorization = `token ${GH_TOKEN}`;
    const res = await fetch(GITHUB_API, { headers: hdrs, cache: 'no-store' });
    if (res.ok) return await res.text();
    if (res.status === 401 || res.status === 403) { GH_TOKEN = ''; localStorage.removeItem('gh_token'); }
  } catch(e) { console.warn('API read failed, falling back to raw:', e); }
  const res = await fetch(CSV_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('raw fetch failed ' + res.status);
  return await res.text();
}
function setOffline(on) { const n = document.getElementById('offline-note'); if (n) n.style.display = on ? 'block' : 'none'; }

async function loadMovies() {
  try {
    let text, offline = false;
    try { text = await fetchCsvText(); localStorage.setItem('csv_cache', text); }
    catch(e) { text = localStorage.getItem('csv_cache'); if (!text) throw e; offline = true; }
    setOffline(offline);
    movies = parseCSV(text);
    // Tonight shelf is keyed on uid now; drop any stale imdb_id entries from older versions
    tonight = new Set([...tonight].filter(id => movies.some(m => m.uid === id)));
    localStorage.setItem('tonight', JSON.stringify([...tonight]));
    refreshCounts();
    renderGrid();
    populateGenres();
    populateShelves();
  } catch(e) {
    document.getElementById('grid').innerHTML = '<p style="color:#556080;padding:20px">Could not load collection.</p>';
  }
}

function fmtClass(f) { return 'fmt-' + String(f || '').replace(/\s+/g,''); }
function fmtLabel(f) { return f === 'Blu-ray' ? 'BD' : (f === '4K Ultra HD' ? '4K' : f); }

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  let filtered = movies.filter(m => {
    if (!isActive(m)) return false;
    if (unwatched && m.watched === 'true') return false;
    if (filter !== 'all' && m.format !== filter) return false;
    if (q && !(m.title.toLowerCase().includes(q) || m.director.toLowerCase().includes(q) || (m.title_da || '').toLowerCase().includes(q) || (m.actors || '').toLowerCase().includes(q))) return false;
    if (genre !== 'all' && !m.genre_ids?.split('|').includes(genre)) return false;
    if (shelf !== 'all' && (m.primary_genre || '') !== shelf) return false;
    return true;
  });
  filtered.sort((a,b) => {
    if (sort === 'title-asc') return a.title.localeCompare(b.title);
    if (sort === 'title-desc') return b.title.localeCompare(a.title);
    if (sort === 'year-desc') return parseInt(b.year) - parseInt(a.year);
    if (sort === 'year-asc') return parseInt(a.year) - parseInt(b.year);
    if (sort === 'added-desc') return (parseInt(b.uid) || 0) - (parseInt(a.uid) || 0);
    if (sort === 'rating-desc') return (parseFloat(b.tmdb_rating) || 0) - (parseFloat(a.tmdb_rating) || 0) || a.title.localeCompare(b.title);
    return 0;
  });
  return filtered;
}

function setGenre(val) {
  genre = val;
  renderGrid();
  populateGenres();
}

function setShelf(val) { shelf = val; renderGrid(); }
function populateShelves() {
  const select = document.getElementById('shelf-select');
  if (!select) return;
  const current = select.value;
  const vals = new Set(movies.filter(isActive).map(m => m.primary_genre).filter(Boolean));
  while (select.options.length > 1) select.remove(1);
  [...vals].sort((a,b) => (SHELVES.indexOf(a) + 1 || 99) - (SHELVES.indexOf(b) + 1 || 99) || a.localeCompare(b))
    .forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; select.appendChild(o); });
  select.value = vals.has(current) ? current : 'all';
  if (select.value === 'all') shelf = 'all';
}

function populateGenres() {
  const select = document.getElementById('genre-select');
  if (!select) return;
  const current = select.value;  // save current
  const genres = new Set();
  movies.filter(isActive).forEach(m => {
    if (m.genre_ids) m.genre_ids.split('|').forEach(g => { if (g.trim()) genres.add(g.trim()); });
  });
  if (genres.size === 0) return;
  while (select.options.length > 1) select.remove(1);
  [...genres].sort().forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    select.appendChild(opt);
  });
  select.value = current;  // restore current
}

function renderGrid() {
  const visible = getFiltered();
  document.getElementById('shelf-count').textContent = visible.length + ' titles';
  document.getElementById('grid').innerHTML = visible.map((m,i) => `
    <div class="card ${tonight.has(m.uid)?'queued':''}" id="c-${m.uid}" onclick="openDetail('${m.uid}')">
      <div class="poster" style="background:#${['1a0a0a','0a1a0a','0a0a1a','1a1a0a','1a0a1a','0a1a1a'][i%6]}">
        <div class="scanlines"></div>
        ${m.poster_url ? `<img src="${escHtml(m.poster_url)}" alt="${escHtml(m.title)}" onerror="this.style.display='none'">` : ''}
        <div class="watched-dot ${m.watched==='true'?'w-yes':'w-no'}" onclick="event.stopPropagation();toggleWatched('${m.uid}')" title="${m.watched==='true'?'Mark unwatched':'Mark watched'}" style="cursor:pointer;"></div>
        <div class="fmt-badge ${fmtClass(m.format)}">${fmtLabel(m.format)}</div>
        <div class="pip"></div>
        ${m.box_set ? `<div class="boxset-icon" title="${escHtml(m.box_set)}">BOX</div>` : ''}
      </div>
      <div class="card-info">
        <div class="card-meta">
          <div class="card-title">${escHtml(m.title)}</div>
          <div class="card-year">${escHtml(m.year)}${fmtRating(m.tmdb_rating) ? ` · <span style="color:#FFD600">${fmtRating(m.tmdb_rating)}</span>` : ''}</div>
        </div>
        <button class="star-btn" onclick="event.stopPropagation();toggleTonight('${m.uid}')" title="Add to tonight">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="${tonight.has(m.uid)?'#FFD600':'none'}" stroke="#FFD600" stroke-width="1.2">
            <polygon points="6,1 7.5,4.5 11.5,4.8 8.7,7.3 9.6,11.2 6,9.1 2.4,11.2 3.3,7.3 0.5,4.8 4.5,4.5"/>
          </svg>
        </button>
      </div>
    </div>
  `).join('');
}

  if (tonight.size > 0) { badge.style.display='flex'; badge.textContent=tonight.size; }
  else { badge.style.display='none'; }
  if (currentView !== 'tonight') return;
  const picked = movies.filter(m => isActive(m) && tonight.has(m.uid));
  const el = document.getElementById('tonight-content');

    el.innerHTML = '<div class="tonight-empty">Nothing on the shelf yet.<br>Star a film from the collection to add it here.</div>';
